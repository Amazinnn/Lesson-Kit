[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson-kit"
version = "0.1.0"
description = "Local, agent-native study material and review workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
wb = "workbench.cli.main:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.setuptools.package-data]
"workbench.server" = [
  "static/*.css",
  "static/*.js",
  "static/katex/*.css",
  "static/katex/*.js",
  "static/katex/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
