name: one-shot widen Paper source

on:
  push:
    branches:
      - paper-practice-run-boundary

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-practice-run-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration patch
        run: python .github/scripts/one-shot-widen-paper-source.py
      - name: Run focused tests
        run: python -m unittest tests.workbench.test_paper_source_schema tests.workbench.test_active_practice
      - name: Commit migrated files and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: widen practice source schema for Paper execution"
          git push origin paper-practice-run-boundary
