name: one-shot Agent UI Artifact handoff

on:
  push:
    branches:
      - feat/agent-ui-artifact-split

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-ui-artifact-split
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Artifact wiring
        run: python .github/scripts/one-shot-agent-artifact.py
      - name: Run focused Artifact tests
        run: |
          python -m unittest tests.workbench.test_paper_artifact_action tests.workbench.test_agent_contracts
          node --test tests/workbench/agent_ui_v1.test.js tests/workbench/agent_session_ui.test.js
      - name: Commit Artifact handoff and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: hand off managed Paper Artifacts with Adaptive Split"
          git push origin feat/agent-ui-artifact-split
