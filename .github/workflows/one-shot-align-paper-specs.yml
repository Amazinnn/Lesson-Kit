name: one-shot align paper specs

on:
  push:
    branches:
      - align-live-specs-paper-model

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-live-specs-paper-model
          fetch-depth: 0
      - run: python .github/scripts/one-shot-align-paper-specs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align live practice specs to Paper model"
          git push origin HEAD:align-live-specs-paper-model
