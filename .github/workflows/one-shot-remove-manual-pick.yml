name: one-shot remove manual picker

on:
  push:
    branches:
      - remove-manual-practice-problem-add

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-manual-practice-problem-add
          fetch-depth: 0
      - run: python .github/scripts/one-shot-remove-manual-pick.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove learner-side manual problem picker"
          git push origin HEAD:remove-manual-practice-problem-add
