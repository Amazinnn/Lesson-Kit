name: one-shot retire picker tests

on:
  push:
    branches:
      - remove-manual-practice-problem-add

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-manual-practice-problem-add
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply test migration
        run: python .github/scripts/one-shot-retire-picker-tests.py
      - name: Run focused tests
        run: |
          python -m unittest tests.workbench.test_retired_manual_problem_include tests.workbench.test_api
          node --test tests/workbench/workbench_ui_interactions.test.js tests/workbench/agent_session.test.js
      - name: Commit migrated tests and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: retire manual picker expectations"
          git push origin remove-manual-practice-problem-add
