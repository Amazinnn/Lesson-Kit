name: one-shot fix Paper workflow docs

on:
  push:
    branches:
      - align-practice-manual-action-docs

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-practice-manual-action-docs
          fetch-depth: 0
      - name: Apply workflow doc fixes
        run: python .github/scripts/one-shot-fix-paper-doc-workflows.py
      - name: Sanity check retired edge and workflow branches
        run: |
          ! grep -q 'P --> PULL' docs/ACTION-GRAPH.md
          grep -q '中途刷新' docs/action-graph/L4-workflows.md
          grep -q '网络失败' docs/action-graph/L4-workflows.md
          grep -q '提前结束' docs/action-graph/L4-workflows.md
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: restore Paper practice failure branches"
          git push origin align-practice-manual-action-docs
