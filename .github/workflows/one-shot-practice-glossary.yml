name: one-shot practice glossary migration

on:
  push:
    branches:
      - retire-direct-kp-practice-terms

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: retire-direct-kp-practice-terms
          fetch-depth: 0
      - name: Rewrite retired practice terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/GLOSSARY.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''### 范围 / Scope
          用户在知识点页或图谱中**显式勾选**的知识点集合，是练习内容的唯一合法来源；存在工作区会话存储（`wb_kp_selection_{ws}`）。弱项排序、每日建议都不得隐式扩大范围。
          _Avoid_：弱项自动抓题、隐式范围
          出处：REQUIREMENTS.md 2026-08-28 段；consolidate-practice-views（专题 19）

          ### 准备练习列表 / Staged Practice List
          练习页上唯一「真正要练的」清单 = 当前范围（选区）的行视图：每行知识点名 + ✕ 清除，与知识点页/图谱勾选双向同步。零独立存储。
          _Avoid_：今日计划队列（旧称，已解散）、自动合流列表
          出处：DISCUSSION-RECORD 专题 19 第 1 条；workbench-ui spec「Practice page staged list and on-demand suggestions」

          ### 建议 / Suggestion
          练习页上**按需拉取**的今日练习建议：计划队列 ∪ 到期调度映射到知识点级去重后的结果。行 = 名称 · 一个短语 · 加入；已选定的不出现在候选中；不常驻、不做独立页面。
          _Avoid_：候选题（Problem Candidate 的中文名带「候选」，两回事）、到期列表（已废弃的常驻视图）
          出处：专题 19 第 2 条；workbench-ui spec 同上
          ''',
          '''### 范围 / Scope
          用户用知识点、图谱区域或其他课程语义明确的**组卷边界**。范围回答「想练什么」，用于约束 Paper Assembly；它本身不是待执行题目清单，也不能直接开始 Practice Run。弱项、到期与建议可以影响组卷排序或成为新的范围建议，但不得静默扩大用户已经明确的范围。
          _Avoid_：待练题目列表、Practice Run 的内容本体、弱项自动抓题、把知识点选择直接当成一次练习
          出处：lesson-kit-product-design.md「组卷」「手动选题」；practice-set-export spec「Paper assembly」

          ### 准备练习列表 / Staged Practice List（已退役）
          **已退役（2026-10-15）**。历史含义是把知识点选区在练习页再显示成一份「真正要练的」清单，并由它直接拉题开练。Paper 成为最小作答单位后，这个中间层不再有产品身份：知识范围直接进入组卷，组卷得到 Paper，Practice Run 只执行已经冻结的 Paper。
          _Avoid_：重新建立「知识点队列 → 直接练习」中间态、把范围列表称为试卷
          出处：lesson-kit-product-design.md「试卷」「组卷」「手动选题」；2026-10-15 practice-model cleanup

          ### 建议 / Suggestion
          练习页按需给出的**组卷起点或练习方向建议**，可来自每日计划、到期调度、薄弱证据等。建议可以预填范围、题型策略或触发「据此组卷」，但不直接向当前 Practice Run 加题，也不维护一份独立的待练知识点队列。
          _Avoid_：Staged Practice List、自动扩充正在执行的 Paper、到期列表（已废弃的常驻视图）
          出处：lesson-kit-product-design.md「练习页」「组卷」；daily-learning-plan spec
          ''',
          "scope/staged/suggestion")

          replace_once(
          '''### 练习模式 / Content Mode
          一轮练习的题型入口，四选一：综合题（exam）/ 小测（micro）/ 判断（yes_no）/ 闪卡（flash_card）。每次会话只允许一种。**「practice path」是它在旧计划语境的别名，统一以本条为准。**
          入库时选哪一档靠字段而不是名额：普通题目（不给 `quiz_type`）进综合题，`quiz_type` 为 `yes_no` 进判断、为 `single_choice`/`multiple_choice` 进小测。**日常说的「题型」指的就是本条（练习模式），不是 `problem_type`**——后者是题目的学科形态（calculation/proof/…），判断题、单选题的 `problem_type` 写 `other`。
          _Avoid_：practice path（旧别名）、答题方式、把「题型」当成 problem_type
          出处：workbench-ui spec「Practice page」；daily-learning-plan spec（别名裁决）；introduce-flash-card；ingest-mode-choice-and-contract-parity
          ''',
          '''### 练习模式 / Content Mode（兼容实现名）
          存量内容与执行代码使用的兼容分类：exam / micro / yes_no / flash_card，用于判断某个内容可以怎样呈现和作答。**它不再定义「开始一轮时四选一」的产品模型，也不要求一张 Paper 只能包含一种形式。** `practice_modes` 等既有字段继续表达内容兼容性；题目的学科形态仍由 `problem_type` 表达。
          _Avoid_：把 Content Mode 当成 Paper 类型、要求整张试卷单一题型、practice path（旧别名）
          出处：lesson-kit-product-design.md「练习规则 / 题型策略」；兼容实现 `practice_mode`

          ### 题型策略 / Practice Format Policy
          规定某类课程内容适合以哪些作答形式练习或检测的**组卷约束**。例如知识点内容可偏判断，记忆型内容可用闪卡，阶段检测可混合多种形式。策略作用于 Paper Assembly，不把整张 Paper 锁成一种题型；用户可以限定策略，但不因此逐题手选。
          _Avoid_：Practice Run 模式开关、单题学科形态 `problem_type`、一卷单一题型
          出处：lesson-kit-product-design.md「练习规则 / 题型策略」
          ''',
          "content mode")

          replace_once(
          '''### 综合题模式 / Exam Mode
          练习模式之一：按范围拉取常规正式题，作答 → 查看解析 → 1–5 自评。未标注 practice_modes 的存量题只在此模式可用。
          _Avoid_：考试模式（不是考试，是常规练习）
          出处：review-workbench spec「Problem pull engine」「Grading input modes」
          ''',
          '''### 综合题模式 / Exam Mode
          Paper 中常规正式题的一种兼容作答形式：自由作答 → 查看解析 → 按当前自评设置记录学习结论。未标注 `practice_modes` 的存量题仍按 exam 兼容。它不是一种独立 Practice Run，也不要求 Paper 中只能出现综合题。
          _Avoid_：考试模式、独立练习入口、一卷单一 exam 模式
          出处：lesson-kit-product-design.md「练习规则 / 题型策略」；review-workbench spec「Grading input modes」
          ''',
          "exam mode")

          replace_once(
          '''### 小测模式 / Micro Mode
          练习模式之一：微题的选择题点选（single_choice / multiple_choice），提交后浏览器本地判分、显示对错与错因，之后仍走 1–5 自评。只拉取标注 micro 可用的微题，无内容时如实空态。**原名「闪卡模式」，2026-08-29 正名出让**：该模式实为微题的卡片式渲染，不是记忆卡。
          _Avoid_：闪卡（旧称，现指另一功能）、自由文本作答（微题一律点选）
          出处：introduce-flash-card；micro-quiz-content spec
          ''',
          '''### 小测模式 / Micro Mode
          Paper 中微题选择题（single_choice / multiple_choice）的兼容作答形式：点选后本地判分并显示错因，再按当前自评设置记录学习结论。它描述 item 的交互形态，不是独立 Practice Run。**原名「闪卡模式」，2026-08-29 正名出让**。
          _Avoid_：闪卡（现指另一内容形式）、自由文本作答、一卷单一 micro 模式
          出处：introduce-flash-card；micro-quiz-content spec；lesson-kit-product-design.md
          ''',
          "micro mode")

          replace_once(
          '''### 闪卡 / Flash Card
          从知识点解构出的键值对记忆卡（类似 dict 的一条键值对）：正面（front）→回忆→揭示背面（back）→1–5 自评，无选项、无判分。知识点是唯一事实源（Note），卡是派生视图（Card），一卡只放一个原子事实；每卡一行独立调度。练习会话第四种模式的练习对象；也可用于背单词、背概念等场景。AI 自动解构知识点成卡（含 cloze 挖空成卡，见 DISCUSSION-RECORD 专题 22 澄清）属 Check 管线后置实验，不在当前范围。
          _Avoid_：小测（微题的卡片式渲染，旧「闪卡」）、普通题冒充
          出处：introduce-flash-card；openspec/specs/flash-card（随归档落位）
          ''',
          '''### 闪卡 / Flash Card
          从知识点解构出的键值对记忆卡（类似 dict 的一条键值对）：正面（front）→回忆→揭示背面（back）→按当前自评设置记录学习结论，无选项、无自动判分。知识点是唯一事实源（Note），卡是派生视图（Card），一卡只放一个原子事实；每卡一行独立调度。闪卡可以作为 Paper 的 item 形式之一，也可用于背单词、背概念等场景。
          _Avoid_：小测（微题的卡片式渲染，旧「闪卡」）、把闪卡另建成绕过 Paper 的独立 Practice Run
          出处：introduce-flash-card；openspec/specs/flash-card；lesson-kit-product-design.md「练习规则 / 题型策略」
          ''',
          "flash card")

          replace_once(
          '''### 判断模式 / Yes-No Mode
          练习模式之一：判断题（是/否），有答案键时浏览器本地立即判分并显示错因；开启自评的轮次随后走 1–5 自评，关闭自评的轮次在显式提交客观尝试时按「判定」的关闭自评规则更新学习投影。无答案键的题不判分、不折算。只拉取标注了 yes_no 可用的微题，无内容时如实空态。
          _Avoid_：主观题自动评分、浏览即掌握
          出处：micro-quiz-content spec；workbench.js gradeMicroQuiz
          ''',
          '''### 判断模式 / Yes-No Mode
          Paper 中判断题（是/否）的兼容作答形式：有答案键时浏览器本地判分并显示错因；是否继续自评由当前设置决定。无答案键的题不判分、不折算。它描述 item 的交互形态，不是独立 Practice Run。
          _Avoid_：主观题自动评分、浏览即掌握、一卷单一 yes_no 模式
          出处：micro-quiz-content spec；workbench.js gradeMicroQuiz；lesson-kit-product-design.md
          ''',
          "yes-no mode")

          replace_once(
          '''### 练习会话 / Practice Session
          一次进行中的练习：单一练习模式 + 不重复的题目队列 + 当前题 + 已见题集合。标签页级存在（sessionStorage），刷新同标签页可恢复；关闭标签页不留任何未提交记录。
          _Avoid_：Agent 对话会话（另一个「会话」，见该条）
          出处：review-workbench spec「Practice session」「Session interruption recovery」
          ''',
          '''### 练习会话 / Practice Session（已退役产品术语）
          **已退役（2026-10-15）**。历史上指「单一练习模式 + 动态题目队列 + 当前题」的标签页状态。产品层统一使用「试卷 / Paper」描述固定作答内容，使用「练习轮次 / Practice Run」描述一次开始、暂停、继续到结束的执行。代码中的 sessionStorage key 或旧 spec 标题可以暂时保留为兼容实现名，但不得继续据此设计新的产品行为。
          _Avoid_：把 Practice Session 与 Practice Run 并列成两种执行实体、把单一模式队列重新定义成练习本体
          出处：lesson-kit-product-design.md「试卷」；2026-10-15 practice-model cleanup
          ''',
          "practice session")

          replace_once(
          '''### 练习集 / Practice Set（界面称「试卷」）
          一份**可复用的有序题目集合**。保存后使用稳定 `ps-NNN` 标识并存于工作区 `.lessonkit/practice-sets/`；编辑它只改变「以后想做什么」，不会产生尝试、进度或评分。开始试卷时把当时的有序题目复制进唯一 active practice，之后执行进度与试卷定义彼此独立。打印/导出仍复用同一清单生成学生卷和解答卷。
          _Avoid_：把试卷本身当作一次作答、把执行进度写回试卷定义
          出处：practice-set-export spec；PR #76/#77

          ### 练习轮次 / Practice Run
          一次 active practice 从开始到完成，或到被显式替换 / 清除的执行过程。运行中仍只有一个 `active_practice`；结束时仅把来源（临时练习 / 试卷 / Agent）、模式、题目顺序、最终状态与时间写入 `practice_runs` 最小快照。逐题作答、判定、自评继续以 `problem_attempts` / `feedback_events` 为唯一学习证据，统计图也只读聚合这些事实。
          _Avoid_：第二套 attempt 表、把图表统计缓存成学习事实、把 practice run 当试卷定义
          出处：review-workbench spec「Durable practice run archive」；workbench-ui spec「Records center」

          ### 练习清单 / Practice Manifest
          `pull --plan <文件>` 写出的 UTF-8 JSON：标题、逐题 `problem_id` + 入卷理由（`reason`）、以及复现这次选题所需的输入（范围/单题/筛选/驱动/上限）。`pull --input <文件>` 可重跑同一份清单得到同一批题；它**是输入清单，不是学习记录**，读它零写入。
          _Avoid_：把它当学习记录或题库、在清单里塞题目正文
          出处：practice-set-export spec「Practice manifest」
          ''',
          '''### 试卷 / Paper
          Lesson Kit 的**最小可执行作答单位**：开始、暂停、继续、提交与完成状态都围绕一张已经冻结 item 顺序的 Paper 发生。Paper 可以由 Agent、预先编排、题库筛选或其他组卷方式产生；知识范围和题型策略只约束组卷，不在 Practice Run 中动态改题。当前 `.lessonkit/practice-sets/`、`ps-NNN`、manifest `kind: practice-set` 与 `/practice-sets/...` 是迁移期兼容实现名，不改变本条产品定义。
          _Avoid_：Practice Run 本身、动态知识点查询、把兼容名 practice-set 当产品题单
          出处：lesson-kit-product-design.md「试卷」；practice-set-export spec「Paper is the Practice Run boundary」

          ### 题单 / Practice Set
          **组织多份 Paper 的容器**，用于按课程进度、专题能力、真题来源等组织练习路径；题单本身不直接进入作答。地图形、桶形等只是题单的视觉布局，不产生新的内容类型。v1 允许题单容器尚未完整实现，但不得再把一张可执行 Paper 命名为产品级 Practice Set。
          _Avoid_：试卷、一次 Practice Run、旧 `.lessonkit/practice-sets/` 目录名的字面解释
          出处：lesson-kit-product-design.md「题单」

          ### 练习轮次 / Practice Run
          对**一张已经确定的 Paper**从开始到完成，或到被显式替换 / 清除的一次执行。运行中仍只有一个 `active_practice`；新执行的来源语义统一为 `paper`，结束时把 Paper 身份、固定 item 顺序、最终状态与时间写入 `practice_runs` 最小快照。逐题作答、判定、自评仍以 `problem_attempts` / `feedback_events` 为学习证据。
          _Avoid_：第二套 attempt 表、动态拉题器、把 Practice Run 当 Paper 定义
          出处：lesson-kit-product-design.md「试卷」；practice-set-export spec「Paper is the Practice Run boundary」；review-workbench spec「Durable practice run archive」

          ### 试卷清单 / Paper Manifest
          `pull --plan <文件>` 写出的 UTF-8 JSON：标题、按序 item 身份与入卷理由，以及复现本次组卷所需的范围、筛选、驱动和上限。`pull --input <文件>` 可重放同一组卷结果；它是 **Paper 的可复现输入/交换工件**，不是学习记录。v1 的 wire-level `kind: practice-set` 属兼容 token。
          _Avoid_：Practice Set 容器、学习记录、在清单里塞题目正文
          出处：practice-set-export spec「Paper manifest」
          ''',
          "paper/practice-set/run/manifest")

          replace_once(
          '''### 选题 / Problem Selection（CLI 组练习）
          `lesson-kit pull` 的选题目径，一次调用组合六种方式：**范围**（`--kp`，缺省用章透镜）、**单题指定**（`--problem`，显式追加、不受筛选与上限约束）、**条件筛选**（`--source-kind`/`--origin-kinds`/`--source-group`/`--exam-year`/`--source-evidence`/`--search-stem`/`--search-source`/客观难度区间）、**薄弱**（`--weak`，用 `domain.weak` 的薄弱分选出有弱点证据的知识点的题）、**到期**（`--due`）、**错题**（`--wrong`，进度为 wrong/stuck 或最近一次尝试为错）。范围决定候选集，条件筛选收窄它，三个驱动在候选集内取并集，单题最后追加；每题回报入卷理由（`scope`/`weak`/`due`/`wrong`/`explicit`）。注意 `--mode weak` 是**排序**（命中知识点多者先），与 `--weak` 驱动不是一回事。`--source-kind`/`--origin-kinds`/`--exam-year`/`--source-evidence` 都可重复，语义见「筛选维度」；`--search-stem`/`--search-source` 是两个关键词域，语义见「题干域 / 来源域」。
          _Avoid_：把 `--weak` 当排序、把驱动当过滤条件之外的隐式扩范围
          出处：review-workbench spec「Problem pull engine」；practice-set-export spec「Practice set composition」
          ''',
          '''### 组卷 / Paper Assembly
          生成或挑选一张具体 Paper 内容的过程。`lesson-kit pull` 当前是确定性组卷引擎：范围（`--kp`）、来源/难度等条件筛选、薄弱 / 到期 / 错题驱动共同决定候选与排序。`--problem` 精确题号能力只作为 Agent/CLI 的**作者工具**保留，用于确定性固定某题；它不得重新暴露成学生在练习页、知识点页或图谱里逐题手选的入口。每个结果仍回报 `scope` / `weak` / `due` / `wrong` / `explicit` 等入卷理由。
          _Avoid_：手动选题 UI、把组卷直接等同 Practice Run、把 `--problem` 当学生侧练习动作
          出处：lesson-kit-product-design.md「组卷」「手动选题」；practice-set-export spec「Paper assembly」
          ''',
          "paper assembly")

          replace_once(
          '''浏览器练习页的「来源筛选」浮窗按维度分组勾选（每项标注池内计数，取自池内实际值；`origin_kinds` 一组显示为历年原题/改编/AI生成），选中的题（搜索挑选）另走 `include_ids`；CLI 用可重复的 `--source-kind`/`--origin-kinds`/`--exam-year`/`--source-evidence`。其余单值参数（`source_kind` 等）保持兼容，与列表参数取并集；单值 `origin_kind` 已由 `origin_kinds` 取代，不保留别名。
          _Avoid_：把维度内的多个值当 AND、把筛选当扩范围、把浮窗选择写进池
          ''',
          '''浏览器中的来源维度只用于约束 Paper Assembly：按维度分组勾选并显示池内实际计数；`origin_kinds` 一组显示为历年原题 / 改编 / AI生成。浏览器不再提供「搜索后挑某一道题加入练习」的 `include_ids` 产品语义；CLI 的精确题号只属于作者工具。其余多值维度仍遵循维度内 OR、维度间 AND。
          _Avoid_：把维度内的多个值当 AND、把筛选当扩范围、手动挑题进入 Practice Run
          ''',
          "filter dimension browser semantics")

          replace_once(
          '''batch 时机下的收束页：只列尚未评分的题，逐题补 1–5 分或跳过全部，一条「再练同类」入口。
          ''',
          '''batch 时机下的收束页：只列尚未评分的题，逐题补 1–5 分或跳过全部；「再练同类」若提供，只能据当前结果重新组一张 Paper，不能给已结束的 Practice Run 动态加题。
          ''',
          "session-end rating")

          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/one-shot-practice-glossary.yml")
          workflow.unlink()
