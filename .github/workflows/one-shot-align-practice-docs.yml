name: one-shot align practice docs

on:
  push:
    branches:
      - align-practice-manual-action-docs

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-practice-manual-action-docs
          fetch-depth: 0
      - run: python .github/scripts/one-shot-align-practice-docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile practice docs with Paper model"
          git push origin HEAD:align-practice-manual-action-docs
