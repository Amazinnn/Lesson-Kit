<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================================
     icons.svg :: 具象静物图标集（写意线稿 + 淡彩 + 克制高光）
     ============================================================================
     依据：decisions.md 收口基线「图案与资产」行 + 第 14 组（14.1 具象静物）
           + 第 17 组 17.1（写意线稿 + 淡彩晕染 + 克制高光）
           + night-paper-tokens.md §7（插画与图标的反相规则）

     5 个导航静物（14.1 点名）：
       练习 = 翻开的书    icon-practice
       试卷 = 一叠纸      icon-exam
       知识点 = 书签      icon-kp
       图谱 = 节点连线    icon-graph
       记录 = 笔记本      icon-record
     附：台灯 icon-lamp :: 第 16.5 组「台灯主题转场」的叙事核心（转场资产）。

     画法约束：
       · 同一支笔：统一 stroke-width 1.6、round cap / round join。
       · 同一套圆角语言：纸张 / 封面的角用 rx 2.4~2.6，呼应 12px 基线的小圆角档。
       · 淡彩用 mk-wash（由引用方按角色给值），线稿用 art-ink，
         纸底用 art-paper，高光用 art-highlight :: 同一套 SVG 换变量换色。
       · 圆底色块由 HTML 侧承担（mk-icon-disc），本文件只画「物」。
       · 本文件是 XML :: 注释里不得出现连续两个以上半角连字符。
     ========================================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">

  <!-- 练习 :: 翻开的书 -->
  <symbol id="icon-practice" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.8 10.2C12.3 7.9 7.6 6.4 4.3 7.3c-.7.2-1.1.8-1.1 1.5v13.6c0 .9.8 1.7 1.7 1.5 3.5-.7 7.4.4 10.9 2.8z"
            fill="var(--art-paper)"/>
      <path d="M15.8 10.2c3.5-2.3 8.2-3.8 11.5-2.9.7.2 1.1.8 1.1 1.5v13.6c0 .9-.8 1.7-1.7 1.5-3.5-.7-7.4.4-10.9 2.8z"
            fill="var(--art-paper)"/>
      <path d="M15.8 10.2v16.5" fill="none"/>
      <path d="M7.6 12.4c2.5-.3 4.8.4 6.7 1.6M24 12.4c-2.5-.3-4.8.4-6.7 1.6"
            fill="none" stroke-width="1.1" opacity=".5"/>
      <path d="M7.6 16.6c2.3-.2 4.4.4 6.1 1.4M24 16.6c-2.3-.2-4.4.4-6.1 1.4"
            fill="none" stroke-width="1.1" opacity=".38"/>
    </g>
    <path d="M4.1 18.2c3.2-.5 6.6.5 9.6 2.4l.6 2.6c-3.5-.8-7.4.4-10.9 2.8z"
          fill="var(--mk-wash)" opacity=".9"/>
    <path d="M15.1 10.6v15.6" fill="none" stroke="var(--art-highlight)" stroke-width="1.4"
          stroke-linecap="round"/>
  </symbol>

  <!-- 试卷 :: 一叠纸 -->
  <symbol id="icon-exam" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10.4" y="4.6" width="14.8" height="17.8" rx="2.6" fill="var(--art-paper)"/>
      <rect x="8.2" y="7.2" width="14.8" height="17.8" rx="2.6" fill="var(--art-paper)"/>
      <rect x="6" y="9.8" width="14.8" height="17.8" rx="2.6" fill="var(--mk-wash)"/>
      <path d="M9.4 14.6h7.9M9.4 18.4h7.9M9.4 22.2h5.1"
            fill="none" stroke-width="1.2" opacity=".55"/>
    </g>
    <path d="M12.2 12.4h5.2" fill="none" stroke="var(--art-highlight)" stroke-width="1.6"
          stroke-linecap="round"/>
  </symbol>

  <!-- 知识点 :: 书签 -->
  <symbol id="icon-kp" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.6 4.6h12.2c.9 0 1.6.7 1.6 1.6v20.6l-7.7-4.5-7.7 4.5V6.2c0-.9.7-1.6 1.6-1.6z"
            fill="var(--mk-wash)"/>
      <path d="M5.2 9.4v16.6l3.6-2.1" fill="none" stroke-width="1.4" opacity=".5"/>
      <path d="M13.4 11.2h7.4M13.4 15.2h5.2" fill="none" stroke-width="1.1" opacity=".55"/>
    </g>
    <path d="M11.4 6.4h9.4" fill="none" stroke="var(--art-highlight)" stroke-width="1.6"
          stroke-linecap="round"/>
  </symbol>

  <!-- 图谱 :: 节点连线 -->
  <symbol id="icon-graph" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.2 22.4 15.4 10.6M15.4 10.6l7.2 6M9.2 22.4h13.4" fill="none"/>
      <circle cx="15.4" cy="9.4" r="3.4" fill="var(--mk-wash)"/>
      <circle cx="8.6" cy="23" r="2.8" fill="var(--art-paper)"/>
      <circle cx="23.4" cy="16.9" r="2.8" fill="var(--art-paper)"/>
      <circle cx="15.4" cy="9.4" r="3.4" fill="none" stroke-width="1.7"/>
    </g>
    <circle cx="14.4" cy="8.4" r="1.1" fill="var(--art-highlight)"/>
  </symbol>

  <!-- 记录 :: 笔记本 -->
  <symbol id="icon-record" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8.2" y="4.4" width="17.2" height="23.2" rx="2.6" fill="var(--art-paper)"/>
      <path d="M12.6 4.4h12.8v23.2H12.6a2 2 0 0 1-2-2V6.4a2 2 0 0 1 2-2z" fill="var(--mk-wash)"/>
      <path d="M10.6 4.4v23.2" fill="none"/>
      <path d="M15.6 11.4h7.6M15.6 15.6h7.6M15.6 19.8h4.8"
            fill="none" stroke-width="1.1" opacity=".55"/>
      <path d="M6.4 9.6c1.3-.7 2.6-.7 3.9 0M6.4 15.8c1.3-.7 2.6-.7 3.9 0M6.4 22c1.3-.7 2.6-.7 3.9 0"
            fill="none" stroke-width="1.2" opacity=".65"/>
    </g>
    <path d="M14.6 7h8.8" fill="none" stroke="var(--art-highlight)" stroke-width="1.6"
          stroke-linecap="round"/>
  </symbol>

  <!-- 台灯 :: 转场资产（第 16.5 组） -->
  <symbol id="icon-lamp" viewBox="0 0 32 32">
    <g stroke="var(--art-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.8 27.2h18.4" fill="none" stroke-width="2"/>
      <path d="M16 27.2v-9.8" fill="none"/>
      <path d="M16 17.4 10.2 11.6" fill="none"/>
      <path d="M5 6.4a3.6 3.6 0 0 1 5.1-.6l4.3 4.3a2.8 2.8 0 0 1-.2 4l-1.7 1.5a3 3 0 0 1-4-.3L4.4 11a2.9 2.9 0 0 1-.3-3.9z"
            fill="var(--mk-wash)"/>
      <path d="M11.2 13.2 5.6 26.4" fill="none" stroke-width="1.2" opacity=".4"/>
    </g>
    <path d="M8.4 12.4c1-.6 2.2-.6 3.2 0" fill="none" stroke="var(--art-highlight)"
          stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

</svg>
