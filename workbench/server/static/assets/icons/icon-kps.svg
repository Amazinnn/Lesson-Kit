<svg viewBox="0 0 48 48" class="asset asset-icon" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="icon-kps-title">
  <title id="icon-kps-title">知识点</title>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g class="asset-icon__ground">
      <circle cx="24" cy="24" r="24" fill="var(--asset-ground-blue, #2b62e8)"/>
    </g>
    <g class="asset-icon__wash">
      <path d="M 12.6 12.4 L 17.2 11.8 L 17.2 36.4 L 12.6 36.6 Z"
