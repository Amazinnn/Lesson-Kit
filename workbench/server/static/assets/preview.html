    .card {

    .stage--wide { flex-direction: column; align-items: flex-start; gap: 8px; }
    .slot svg { display: block; height: auto; }
    .slot--16 svg { width: 16px; } .slot--24 svg { width: 24px; } .slot--32 svg { width: 32px; }
    .slot--120 svg { width: 120px; } .slot--180 svg { width: 180px; } .slot--240 svg { width: 240px; }

    .row--empty .card { width: 268px; }
    .row--icons .card { width: 150px; }
    .row--lamp .card { width: 232px; }
    .stage--lamp {
      position: relative; width: 200px; height: 200px; overflow: hidden;
      border-radius: 8px; background: var(--asset-paper); display: block;
    }
    .stage--lamp svg.lk-lamp {
      position: absolute; right: 8px; bottom: 8px; width: 132px; height: 132px;
      transform-origin: 50% 100%; transform-box: view-box;
    }

    .pose--a svg.lk-lamp { transform: translate3d(0,120%,0) scale(.86) rotate(-12deg); opacity: 0; }
    .pose--b svg.lk-lamp { transform: translate3d(0,0,0) scale(1) rotate(0deg); opacity: 1; }
    .pose--c svg.lk-lamp { transform: translate3d(0,0,0) scale(1) rotate(0deg); opacity: 1; }
