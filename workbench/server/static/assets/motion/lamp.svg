<svg class="lk-lamp" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lamp-title" aria-hidden="true" focusable="false" stroke-linecap="round" stroke-linejoin="round">
  <title id="lamp-title">静物插画：一盏台灯</title>
  <defs>
    <radialGradient id="lamp-gLamp" gradientUnits="userSpaceOnUse" cx="118" cy="131" r="60">
      <stop offset="0" stop-color="var(--asset-lamp-warm, #f7c46b)" stop-opacity=".55"/>
      <stop offset="1" stop-color="var(--asset-lamp-warm, #f7c46b)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="lk-lamp__body" fill="none" stroke="var(--asset-ink, #2a2620)">
    <g class="lk-lamp__base">
      <path d="M 99.5 196 L 140.5 196 Q 143 196 144 198.5 L 152 222 Q 153 226 149 226 L 91 226 Q 87 226 88 222 L 96 198.5 Q 97 196 99.5 196 Z" stroke-width="3"/>
      <path d="M 100 196 L 140 196" stroke-width="2"/>
      <path d="M 91.5 226 L 148.5 226" stroke-width="2"/>
    </g>
    <g class="lk-lamp__stem">
